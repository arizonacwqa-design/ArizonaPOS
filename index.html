<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArizonaPOS — Friend's &amp; Co Software</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme and language before first paint to avoid a flash of the wrong
      // state on initial load. Keep in sync with themeStore.js and languageStore.js.
      (function () {
        try {
          var t = localStorage.getItem('acw_theme');
          if (t === 'light') {
            document.documentElement.classList.add('theme-light');
          } else {
            document.documentElement.classList.add('theme-dark');
          }

          var l = localStorage.getItem('acw_language');
          if (l === 'ar') {
            document.documentElement.setAttribute('lang', 'ar');
            document.documentElement.setAttribute('dir', 'rtl');
          } else {
            document.documentElement.setAttribute('lang', 'en');
            document.documentElement.setAttribute('dir', 'ltr');
          }
          // NOTE: Do NOT set documentElement.style.fontFamily here.
          // That inline style overrides Tailwind's font-sans on body,
          // forcing Outfit (a display font) onto buttons/inputs/labels and
          // making the desktop UI look "zoomed". Body font is set in
          // src/index.css; Outfit stays as `font-display` for headings only.
        } catch (e) {
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
